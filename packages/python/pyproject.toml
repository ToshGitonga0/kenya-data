[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kenya-data"
version = "0.1.2"
description = "Python SDK for Kenyan administrative data (counties, constituencies, wards) bundled as a SQLite database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Charles Gitonga", email = "gitongachas@gmail.com" }]
keywords = ["kenya", "administrative-data", "counties", "constituencies", "wards", "sqlite", "geodata", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ToshGitonga0/kenya-data"
Repository = "https://github.com/ToshGitonga0/kenya-data"
Issues = "https://github.com/ToshGitonga0/kenya-data/issues"
Changelog = "https://github.com/ToshGitonga0/kenya-data/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/kenya_data"]

[tool.hatch.build.targets.wheel.force-include]
"src/kenya_data/kenya.db" = "kenya_data/kenya.db"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
